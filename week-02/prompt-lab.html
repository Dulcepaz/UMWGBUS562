<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Lab</title>
<style>
  :root {
    --bg: #f6f5f1;
    --panel: #ffffff;
    --text: #1f1e1c;
    --muted: #6b6862;
    --border: #dddad2;
    --accent: #c15f3c;
    --accent-text: #ffffff;
    --system-bg: #eef1f6;
    --system-edge: #5b7bb2;
    --you-bg: #f8efe9;
    --you-edge: #c15f3c;
    --claude-bg: #ffffff;
    --claude-edge: #6b8e5a;
    --note-text: #6b6862;
    --error-bg: #fbeaea;
    --error-edge: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1b19;
      --panel: #262522;
      --text: #ecebe7;
      --muted: #a3a09a;
      --border: #3a3834;
      --accent: #d97757;
      --accent-text: #1c1b19;
      --system-bg: #232a36;
      --system-edge: #7f9fd6;
      --you-bg: #33281f;
      --you-edge: #d97757;
      --claude-bg: #262522;
      --claude-edge: #8fb27c;
      --note-text: #a3a09a;
      --error-bg: #3a2120;
      --error-edge: #f28b82;
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .app {
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 16px 32px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    min-height: 100vh;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
  }
  h1 { margin: 0; font-size: 22px; }
  .model { color: var(--muted); font-size: 13px; font-family: ui-monospace, Menlo, monospace; }

  label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .hint { font-weight: 400; color: var(--muted); }
  input, textarea {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    color: var(--text);
    font: inherit;
  }
  textarea { resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

  #log {
    flex: 1;
    min-height: 260px;
    max-height: 55vh;
    overflow-y: auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .empty { color: var(--muted); text-align: center; margin: auto; }
  .msg {
    border-left: 4px solid;
    border-radius: 6px;
    padding: 8px 12px;
  }
  .msg .role {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 2px;
  }
  .msg .body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg.system { background: var(--system-bg); border-color: var(--system-edge); }
  .msg.system .role { color: var(--system-edge); }
  .msg.you { background: var(--you-bg); border-color: var(--you-edge); }
  .msg.you .role { color: var(--you-edge); }
  .msg.claude { background: var(--claude-bg); border-color: var(--claude-edge); border: 1px solid var(--border); border-left: 4px solid var(--claude-edge); }
  .msg.claude .role { color: var(--claude-edge); }
  .msg.error { background: var(--error-bg); border-color: var(--error-edge); }
  .msg.error .role { color: var(--error-edge); }
  .msg.failed { opacity: 0.55; }
  .msg.failed .role::after { content: " (not sent)"; text-transform: none; font-weight: 400; }
  .note {
    color: var(--note-text);
    font-size: 13px;
    font-style: italic;
    text-align: center;
    white-space: pre-wrap;
  }
  .waiting { color: var(--muted); font-style: italic; }
  .waiting .dots::after {
    content: "";
    animation: dots 1.2s steps(4, end) infinite;
  }
  @keyframes dots {
    0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; }
  }

  .buttons { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
  button {
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>Prompt Lab</h1>
    <span class="model" id="modelName"></span>
  </header>

  <div>
    <label for="apiKey">Anthropic API key <span class="hint">(kept in this page only; never saved)</span></label>
    <input id="apiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-...">
  </div>

  <div>
    <label for="systemPrompt">System prompt <span class="hint">(optional)</span></label>
    <textarea id="systemPrompt" rows="2" placeholder="e.g. You are a concise tutor for business students."></textarea>
  </div>

  <div id="log" aria-live="polite"></div>

  <div>
    <label for="prompt">Prompt <span class="hint">(Ctrl/Cmd + Enter to send)</span></label>
    <textarea id="prompt" rows="4" placeholder="Type your prompt..."></textarea>
  </div>

  <div class="buttons">
    <button id="exportBtn">Export</button>
    <button id="newBtn">New Conversation</button>
    <button id="sendBtn" class="primary">Send</button>
  </div>
</div>

<script>
  const MODEL = "claude-sonnet-5";
  const API_URL = "https://api.anthropic.com/v1/messages";
  const MAX_TOKENS = 16000;

  const apiKeyInput = document.getElementById("apiKey");
  const systemInput = document.getElementById("systemPrompt");
  const promptInput = document.getElementById("prompt");
  const logEl = document.getElementById("log");
  const sendBtn = document.getElementById("sendBtn");
  const newBtn = document.getElementById("newBtn");
  const exportBtn = document.getElementById("exportBtn");

  document.getElementById("modelName").textContent = MODEL;

  // messages: exactly what is sent to the API (assistant turns keep their full content blocks).
  // entries: what the log shows, in order: {kind: "system"|"you"|"claude"|"note"|"error", text}.
  let messages = [];
  let entries = [];
  let activeSystem = null;   // system prompt Claude is currently given (null = none sent yet)
  let waiting = false;

  function render() {
    logEl.replaceChildren();
    if (entries.length === 0 && !waiting) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No messages yet. Each prompt is sent together with the whole conversation shown here.";
      logEl.appendChild(empty);
      return;
    }
    for (const entry of entries) {
      if (entry.kind === "note") {
        const note = document.createElement("div");
        note.className = "note";
        note.textContent = entry.text;
        logEl.appendChild(note);
        continue;
      }
      const msg = document.createElement("div");
      msg.className = "msg " + entry.kind + (entry.failed ? " failed" : "");
      const role = document.createElement("div");
      role.className = "role";
      role.textContent = { system: "System", you: "You", claude: "Claude", error: "Error" }[entry.kind];
      const body = document.createElement("div");
      body.className = "body";
      body.textContent = entry.text;
      msg.append(role, body);
      logEl.appendChild(msg);
    }
    if (waiting) {
      const w = document.createElement("div");
      w.className = "waiting";
      w.innerHTML = 'Claude is responding<span class="dots"></span>';
      logEl.appendChild(w);
    }
    logEl.scrollTop = logEl.scrollHeight;
  }

  function setWaiting(on) {
    waiting = on;
    sendBtn.disabled = on;
    newBtn.disabled = on;
    exportBtn.disabled = on;
    sendBtn.textContent = on ? "Waiting..." : "Send";
    render();
  }

  // Record the system prompt in the log the first time it is used, and note any change.
  function syncSystemPrompt() {
    const current = systemInput.value.trim();
    const effective = current === "" ? null : current;
    if (entries.length === 0) {
      if (effective !== null) entries.push({ kind: "system", text: effective });
    } else if (effective !== activeSystem) {
      entries.push({
        kind: "note",
        text: effective === null
          ? "System prompt removed. From here on, Claude sees the conversation with no system prompt."
          : "System prompt changed. From here on, Claude sees only this new system prompt (it replaces the old one for the whole conversation).",
      });
      if (effective !== null) entries.push({ kind: "system", text: effective });
    }
    activeSystem = effective;
  }

  async function send() {
    if (waiting) return;
    const apiKey = apiKeyInput.value.trim();
    const text = promptInput.value.trim();
    if (!apiKey) { apiKeyInput.focus(); alert("Paste your Anthropic API key first."); return; }
    if (!text) { promptInput.focus(); return; }

    syncSystemPrompt();
    promptInput.value = "";
    const youEntry = { kind: "you", text };
    entries.push(youEntry);
    messages.push({ role: "user", content: text });
    setWaiting(true);

    const body = { model: MODEL, max_tokens: MAX_TOKENS, messages };
    if (activeSystem !== null) body.system = activeSystem;

    try {
      const res = await fetch(API_URL, {
        method: "POST",
        headers: {
          "content-type": "application/json",
          "x-api-key": apiKey,
          "anthropic-version": "2026-10-21",
          "anthropic-dangerous-direct-browser-access": "true",
        },
        body: JSON.stringify(body),
      });
      const data = await res.json().catch(() => null);
      if (!res.ok) {
        const detail = data && data.error ? `${data.error.type}: ${data.error.message}` : res.statusText;
        throw new Error(`HTTP ${res.status} - ${detail}`);
      }
      if (data.stop_reason === "refusal") {
        throw new Error("Claude declined to answer this prompt (stop reason: refusal).");
      }

      const reply = data.content
        .filter(block => block.type === "text")
        .map(block => block.text)
        .join("");
      // Send Claude's full content back on later turns, as the API expects.
      messages.push({ role: "assistant", content: data.content });
      entries.push({ kind: "claude", text: reply });
      if (data.stop_reason === "max_tokens") {
        entries.push({ kind: "note", text: `Reply was cut off at the ${MAX_TOKENS}-token limit.` });
      }
    } catch (err) {
      // The prompt got no reply, so take it back out of the conversation and return it to the box.
      messages.pop();
      youEntry.failed = true;
      const message = err instanceof TypeError
        ? "Could not reach the Anthropic API. Check your internet connection."
        : err.message;
      entries.push({ kind: "error", text: message + "\nYour prompt was not added to the conversation; it is back in the prompt box." });
      if (!promptInput.value) promptInput.value = text;
    } finally {
      setWaiting(false);
      promptInput.focus();
    }
  }

  function newConversation() {
    if (waiting) return;
    messages = [];
    entries = [];
    activeSystem = null;
    render();
    promptInput.focus();
  }

  function exportMarkdown() {
    const lines = [MODEL, ""];
    for (const entry of entries) {
      if (entry.failed) continue;
      const heading = { system: "System", you: "You", claude: "Claude" }[entry.kind];
      if (!heading) continue;
      lines.push(`### ${heading}`, "", entry.text, "");
    }
    if (lines.length === 2) { alert("There is nothing to export yet."); return; }

    const blob = new Blob([lines.join("\n")], { type: "text/markdown" });
    const stamp = new Date().toISOString().slice(0, 16).replace(/[:T]/g, "-");
    const link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = `prompt-lab-${stamp}.md`;
    link.click();
    URL.revokeObjectURL(link.href);
  }

  sendBtn.addEventListener("click", send);
  newBtn.addEventListener("click", newConversation);
  exportBtn.addEventListener("click", exportMarkdown);
  promptInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); send(); }
  });

  render();
</script>
</body>
</html>
