<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Four</title>
<style>
  :root {
    --bg: #f4f1ea;
    --surface: #ffffff;
    --text: #1d1f24;
    --muted: #6b6f78;
    --line: #e2ddd2;
    --board: #2f5bd3;
    --board-edge: #2549b0;
    --p1: #e5484d;
    --p1-hi: #ff8a8d;
    --p1-lo: #b3262b;
    --p2: #f5b400;
    --p2-hi: #ffe07a;
    --p2-lo: #c48a00;
    --accent: #2f5bd3;
    --on-accent: #ffffff;
    --shadow: 0 18px 40px -18px rgba(30, 40, 80, .45);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161c;
      --surface: #1d2028;
      --text: #eef0f4;
      --muted: #9aa0ab;
      --line: #2c303a;
      --board: #3461dc;
      --board-edge: #2346a8;
      --accent: #7b9cff;
      --on-accent: #0f1630;
      --shadow: 0 18px 40px -18px rgba(0, 0, 0, .8);
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161c; --surface: #1d2028; --text: #eef0f4; --muted: #9aa0ab; --line: #2c303a;
    --board: #3461dc; --board-edge: #2346a8; --accent: #7b9cff; --on-accent: #0f1630; --shadow: 0 18px 40px -18px rgba(0, 0, 0, .8);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 40px;
    -webkit-tap-highlight-color: transparent;
  }
  .app { width: 100%; max-width: 540px; display: flex; flex-direction: column; gap: 18px; }

  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
  h1 span { color: var(--p1); }
  h1 span + span { color: var(--p2); }

  .scores { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; }
  .score {
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px 14px; display: flex; align-items: center; gap: 10px;
    transition: box-shadow .25s, border-color .25s;
  }
  .score.active { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  .score.ai { flex-direction: row-reverse; text-align: right; }
  .score .chip { width: 22px; height: 22px; border-radius: 50%; flex: none; }
  .score .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
  .score .num { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .score.draws { flex-direction: column; gap: 0; justify-content: center; text-align: center; padding: 10px 12px; }
  .chip.p1 { background: radial-gradient(circle at 35% 30%, var(--p1-hi), var(--p1) 55%, var(--p1-lo)); }
  .chip.p2 { background: radial-gradient(circle at 35% 30%, var(--p2-hi), var(--p2) 55%, var(--p2-lo)); }

  .status {
    text-align: center; font-size: 17px; font-weight: 600; min-height: 26px;
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .status .dots span { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: currentColor; margin: 0 1.5px; animation: blink 1s infinite; }
  .status .dots span:nth-child(2) { animation-delay: .15s; }
  .status .dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }

  /* Board: discs sit in a layer behind a frame whose holes are a radial-gradient mask. */
  .stage { --pad: clamp(8px, 2.6vw, 14px); padding: 0 var(--pad) var(--pad); }
  .preview { position: relative; aspect-ratio: 7 / 1; margin-bottom: calc(var(--pad) + 6px); }
  .ghost {
    position: absolute; top: 0; width: calc(100% / 7); height: 100%;
    left: calc(var(--c, 3) * 100% / 7);
    transition: left .12s ease-out, opacity .15s;
  }
  .ghost::before { content: ""; position: absolute; inset: 10%; border-radius: 50%; }
  .ghost.p1::before { background: radial-gradient(circle at 35% 30%, var(--p1-hi), var(--p1) 55%, var(--p1-lo)); }
  .ghost.p2::before { background: radial-gradient(circle at 35% 30%, var(--p2-hi), var(--p2) 55%, var(--p2-lo)); }
  .ghost.hidden { opacity: 0; }

  .grid { position: relative; aspect-ratio: 7 / 6; }
  .discs { position: absolute; inset: 0; z-index: 1; }
  .frame {
    position: absolute; inset: 0; z-index: 2; pointer-events: none; border-radius: 6px;
    background: radial-gradient(circle, transparent 0 58.6%, var(--board) 59.6%);
    background-size: calc(100% / 7) calc(100% / 6);
    box-shadow: 0 0 0 var(--pad) var(--board), 0 calc(var(--pad) + 6px) 0 var(--pad) var(--board-edge), var(--shadow);
  }
  .cols { position: absolute; left: 0; right: 0; bottom: 0; top: calc(-100% / 6 - var(--pad) - 6px); z-index: 3; display: flex; }
  .col { flex: 1; border: 0; background: transparent; padding: 0; cursor: pointer; border-radius: 10px; outline: none; }
  .col:disabled { cursor: default; }
  .col.focus { background: color-mix(in srgb, #fff 9%, transparent); }

  .disc {
    position: absolute; width: calc(100% / 7); height: calc(100% / 6);
    left: calc(var(--c) * 100% / 7); top: calc(var(--r) * 100% / 6);
    animation: drop var(--dur, .4s) forwards;
  }
  .disc::before {
    content: ""; position: absolute; inset: 10%; border-radius: 50%;
    box-shadow: inset 0 -3px 0 rgba(0,0,0,.18), inset 0 0 0 4px rgba(255,255,255,.12);
    transition: opacity .4s, transform .3s;
  }
  .disc.p1::before { background: radial-gradient(circle at 35% 30%, var(--p1-hi), var(--p1) 55%, var(--p1-lo)); }
  .disc.p2::before { background: radial-gradient(circle at 35% 30%, var(--p2-hi), var(--p2) 55%, var(--p2-lo)); }
  .disc.last::after {
    content: ""; position: absolute; left: 50%; top: 50%; width: 12%; height: 12%;
    transform: translate(-50%, -50%); border-radius: 50%; background: rgba(255,255,255,.75);
  }
  .grid.over .disc:not(.win)::before { opacity: .35; }
  .disc.win::before { animation: pulse 1.1s ease-in-out infinite; }
  .disc.win::after {
    content: ""; position: absolute; inset: 6%; border-radius: 50%; width: auto; height: auto;
    transform: none; background: none; border: 3px solid #fff; opacity: .9;
  }
  @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(.9); } }
  @keyframes drop {
    0% { transform: translateY(calc(-100% * (var(--r) + 1) - var(--pad) - 6px)); animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
    72% { transform: translateY(0); animation-timing-function: cubic-bezier(0, .55, .45, 1); }
    86% { transform: translateY(-9%); animation-timing-function: cubic-bezier(.55, 0, 1, .45); }
    100% { transform: translateY(0); }
  }

  .controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; margin-top: 8px; }
  button.btn, select {
    font: inherit; font-size: 14px; font-weight: 600; color: var(--text);
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 14px; cursor: pointer; transition: border-color .15s, transform .1s;
  }
  button.btn:hover:not(:disabled), select:hover { border-color: var(--accent); }
  button.btn:active:not(:disabled) { transform: translateY(1px); }
  button.btn:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .modes { display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
  .modes button {
    flex: 1; font: inherit; font-size: 14px; font-weight: 600; color: var(--muted);
    background: transparent; border: 0; border-radius: 8px; padding: 8px 10px; cursor: pointer;
    transition: background .2s, color .2s;
  }
  .modes button:hover { color: var(--text); }
  .modes button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  label.diff[hidden] { display: none; }
  label.diff { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  .hint { text-align: center; font-size: 12px; color: var(--muted); margin: 0; }
  kbd { font-family: inherit; font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }
</style>
</head>
<body>
<main class="app">
  <header>
    <h1>Connect <span>F</span><span>our</span></h1>
    <button class="btn" id="sound" title="Toggle sound" aria-pressed="true">Sound on</button>
  </header>

  <div class="modes" role="group" aria-label="Game mode">
    <button id="mode-ai" data-mode="ai">vs Computer</button>
    <button id="mode-pvp" data-mode="pvp">Two players</button>
  </div>

  <section class="scores" aria-label="Score">
    <div class="score" id="score-you">
      <div class="chip p1"></div>
      <div><div class="label" id="l-you">You</div><div class="num" id="n-you">0</div></div>
    </div>
    <div class="score draws">
      <div class="label">Draws</div><div class="num" id="n-draw">0</div>
    </div>
    <div class="score ai" id="score-ai">
      <div class="chip p2"></div>
      <div><div class="label" id="l-ai">Computer</div><div class="num" id="n-ai">0</div></div>
    </div>
  </section>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <section class="stage">
    <div class="preview"><div class="ghost p1" id="ghost"></div></div>
    <div class="grid" id="grid">
      <div class="discs" id="discs"></div>
      <div class="frame"></div>
      <div class="cols" id="cols"></div>
    </div>
  </section>

  <div class="controls">
    <button class="btn primary" id="new">New game</button>
    <button class="btn" id="undo">Undo</button>
    <label class="diff" id="diff">Computer
      <select id="level">
        <option value="1">Casual</option>
        <option value="2" selected>Challenging</option>
        <option value="3">Tough</option>
      </select>
    </label>
  </div>
  <p class="hint">Click a column, or use <kbd>←</kbd> <kbd>→</kbd> and <kbd>Enter</kbd> (or <kbd>1</kbd>–<kbd>7</kbd>). First move alternates each game.</p>
</main>

<script>
(() => {
  const ROWS = 6, COLS = 7, SIZE = ROWS * COLS, HUMAN = 1, AI = 2, WIN = 1e6;
  const ORDER = [3, 2, 4, 1, 5, 0, 6];
  const NAMES = { 1: "Red", 2: "Yellow" };
  const LEVELS = { 1: { depth: 2, blunder: 0.18, noise: 6 }, 2: { depth: 5, blunder: 0, noise: 0 }, 3: { depth: 7, blunder: 0, noise: 0 } };

  // Every line of four cells, plus an index of which lines pass through each cell.
  const LINES = [], LINES_AT = Array.from({ length: SIZE }, () => []);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
      const er = r + 3 * dr, ec = c + 3 * dc;
      if (er < 0 || er >= ROWS || ec < 0 || ec >= COLS) continue;
      const line = [0, 1, 2, 3].map(k => (r + k * dr) * COLS + c + k * dc);
      LINES.push(line);
      line.forEach(i => LINES_AT[i].push(line));
    }
  }

  const $ = id => document.getElementById(id);
  const gridEl = $("grid"), discsEl = $("discs"), colsEl = $("cols"), ghost = $("ghost"), statusEl = $("status");

  const store = {
    get(k, d) { try { const v = localStorage.getItem("c4-" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
    set(k, v) { try { localStorage.setItem("c4-" + k, JSON.stringify(v)); } catch {} },
  };

  let board, heights, moves, history, turn, over, busy, gameId = 0, focusCol = 3;
  let starter = store.get("starter", HUMAN);
  // Scores are kept per mode; in two-player mode "you" is Red and "ai" is Yellow.
  let mode = store.get("mode", "ai");
  const allScores = { ai: store.get("scores", { you: 0, draw: 0, ai: 0 }), pvp: store.get("scores-pvp", { you: 0, draw: 0, ai: 0 }) };
  const vsAI = () => mode === "ai";
  let soundOn = store.get("sound", true);
  $("level").value = store.get("level", "2");

  // ---------- Board primitives (shared by the game and the AI search) ----------
  function drop(c, p) {
    const i = (ROWS - 1 - heights[c]) * COLS + c;
    board[i] = p; heights[c]++; moves++;
    return i;
  }
  function undrop(c) {
    heights[c]--; moves--;
    board[(ROWS - 1 - heights[c]) * COLS + c] = 0;
  }
  function winLine(i, p) {
    for (const line of LINES_AT[i]) if (line.every(j => board[j] === p)) return line;
    return null;
  }

  // ---------- AI: minimax with alpha-beta pruning ----------
  function evaluate() {
    let s = 0;
    for (let r = 0; r < ROWS; r++) {
      const v = board[r * COLS + 3];
      if (v === AI) s += 3; else if (v === HUMAN) s -= 3;
    }
    for (const line of LINES) {
      let a = 0, h = 0;
      for (const j of line) { if (board[j] === AI) a++; else if (board[j] === HUMAN) h++; }
      if (a && h) continue;
      if (a === 3) s += 5; else if (a === 2) s += 2;
      else if (h === 3) s -= 6; else if (h === 2) s -= 2;
    }
    return s;
  }

  function search(depth, alpha, beta, player) {
    const maximizing = player === AI;
    let best = maximizing ? -Infinity : Infinity;
    for (const c of ORDER) {
      if (heights[c] >= ROWS) continue;
      const i = drop(c, player);
      let s;
      if (winLine(i, player)) s = maximizing ? WIN + depth : -WIN - depth;
      else if (moves === SIZE) s = 0;
      else if (depth <= 1) s = evaluate();
      else s = search(depth - 1, alpha, beta, maximizing ? HUMAN : AI);
      undrop(c);
      if (maximizing) { if (s > best) best = s; if (best > alpha) alpha = best; }
      else { if (s < best) best = s; if (best < beta) beta = best; }
      if (alpha >= beta) break;
    }
    return best === Infinity || best === -Infinity ? 0 : best;
  }

  function chooseMove() {
    const { depth, blunder, noise } = LEVELS[$("level").value];
    const legal = ORDER.filter(c => heights[c] < ROWS);
    if (blunder && Math.random() < blunder) return legal[Math.floor(Math.random() * legal.length)];
    let bestCol = legal[0], bestScore = -Infinity;
    for (const c of legal) {
      const i = drop(c, AI);
      let s;
      if (winLine(i, AI)) s = WIN + depth;
      else if (moves === SIZE) s = 0;
      else if (depth <= 1) s = evaluate();
      else s = search(depth - 1, noise ? -Infinity : bestScore, Infinity, HUMAN);
      undrop(c);
      if (noise) s += (Math.random() * 2 - 1) * noise;
      if (s > bestScore) { bestScore = s; bestCol = c; }
    }
    return bestCol;
  }

  // ---------- Sound ----------
  let audio;
  function thunk(row) {
    if (!soundOn) return;
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const t = audio.currentTime, o = audio.createOscillator(), g = audio.createGain();
      o.type = "triangle";
      o.frequency.setValueAtTime(240 - row * 12, t);
      o.frequency.exponentialRampToValueAtTime(90, t + 0.12);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.25, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + 0.18);
    } catch {}
  }
  function chime(win) {
    if (!soundOn || !audio) return;
    const notes = win ? [523, 659, 784, 1047] : [392, 330, 262];
    notes.forEach((f, k) => {
      const t = audio.currentTime + k * 0.11, o = audio.createOscillator(), g = audio.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.18, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35);
      o.connect(g).connect(audio.destination);
      o.start(t); o.stop(t + 0.4);
    });
  }

  // ---------- Game flow ----------
  function newGame(alternate) {
    gameId++;
    if (alternate) { starter = starter === HUMAN ? AI : HUMAN; store.set("starter", starter); }
    board = new Array(SIZE).fill(0);
    heights = new Array(COLS).fill(0);
    moves = 0; history = []; over = false; busy = false;
    turn = starter;
    discsEl.innerHTML = "";
    gridEl.classList.remove("over");
    render();
    if (vsAI() && turn === AI) aiTurn();
  }

  function play(c) {
    const p = turn, r = ROWS - 1 - heights[c];
    const i = drop(c, p);
    history.push(c);
    discsEl.querySelectorAll(".last").forEach(d => d.classList.remove("last"));
    const el = document.createElement("div");
    el.className = `disc p${p} last`;
    el.dataset.i = i;
    el.style.setProperty("--r", r);
    el.style.setProperty("--c", c);
    const dur = 0.28 + Math.sqrt(r + 1) * 0.12;
    el.style.setProperty("--dur", dur + "s");
    discsEl.appendChild(el);
    setTimeout(() => thunk(r), dur * 720);

    const line = winLine(i, p);
    if (line || moves === SIZE) {
      over = true; busy = true;
      const result = line ? (p === HUMAN ? "you" : "ai") : "draw";
      allScores[mode][result]++;
      store.set(vsAI() ? "scores" : "scores-pvp", allScores[mode]);
      setTimeout(() => {
        if (line) line.forEach(j => discsEl.querySelector(`[data-i="${j}"]`).classList.add("win"));
        gridEl.classList.add("over");
        if (result !== "draw") chime(result === "you" || !vsAI());
        busy = false;
        render();
      }, dur * 1000);
    } else {
      turn = p === HUMAN ? AI : HUMAN;
    }
    render();
    return dur;
  }

  function aiTurn() {
    busy = true; render();
    const id = gameId;
    setTimeout(() => {
      if (id !== gameId) return;
      const c = chooseMove();
      setTimeout(() => {
        if (id !== gameId) return;
        const dur = play(c);
        setTimeout(() => { if (id === gameId && !over) { busy = false; render(); } }, dur * 600);
      }, 120);
    }, 380);
  }

  function humanMove(c) {
    if (over || busy || (vsAI() && turn !== HUMAN) || heights[c] >= ROWS) return;
    focusCol = c;
    play(c);
    if (!over && vsAI()) aiTurn();
  }

  function undo() {
    if (!canUndo()) return;
    // Against the computer, roll back to just before the human's most recent move; otherwise one move.
    do {
      const c = history.pop();
      const i = (ROWS - heights[c]) * COLS + c;
      undrop(c);
      discsEl.querySelector(`[data-i="${i}"]`)?.remove();
      turn = board.filter(Boolean).length % 2 === 0 ? starter : (starter === HUMAN ? AI : HUMAN);
    } while (vsAI() && history.length && turn !== HUMAN);
    if (vsAI() && turn !== HUMAN) { aiTurn(); return; }
    const last = history.length && discsEl.querySelector(`[data-i="${(ROWS - heights[history.at(-1)]) * COLS + history.at(-1)}"]`);
    if (last) last.classList.add("last");
    render();
  }

  // ---------- Rendering ----------
  function render() {
    let html = statusEl.innerHTML;
    if (over && busy) {
      // Hold the old status until the final disc lands.
    } else if (over) {
      const last = history.at(-1), i = (ROWS - heights[last]) * COLS + last;
      const winner = winLine(i, board[i]) ? board[i] : 0;
      html = !winner ? "It's a draw."
        : !vsAI() ? `${NAMES[winner]} wins! 🎉`
        : winner === HUMAN ? "You win! 🎉" : "Computer wins this one.";
    } else if (!vsAI()) {
      html = `<span class="chip p${turn}" style="width:16px;height:16px;border-radius:50%"></span> ${NAMES[turn]}'s turn`;
    } else if (turn === AI) {
      html = `Computer is thinking <span class="dots"><span></span><span></span><span></span></span>`;
    } else {
      html = moves === 0 ? "Your move — you're red." : "Your turn";
    }
    statusEl.innerHTML = html;

    const scores = allScores[mode];
    $("n-you").textContent = scores.you;
    $("n-draw").textContent = scores.draw;
    $("n-ai").textContent = scores.ai;
    $("l-you").textContent = vsAI() ? "You" : NAMES[HUMAN];
    $("l-ai").textContent = vsAI() ? "Computer" : NAMES[AI];
    $("diff").hidden = !vsAI();
    $("mode-ai").setAttribute("aria-pressed", vsAI());
    $("mode-pvp").setAttribute("aria-pressed", !vsAI());
    $("score-you").classList.toggle("active", !over && turn === HUMAN);
    $("score-ai").classList.toggle("active", !over && turn === AI);

    const humanCanMove = !over && !busy && (turn === HUMAN || !vsAI());
    $("undo").disabled = !canUndo();
    ghost.className = `ghost p${turn}`;
    ghost.classList.toggle("hidden", !humanCanMove || heights[focusCol] >= ROWS);
    ghost.style.setProperty("--c", focusCol);
    [...colsEl.children].forEach((b, c) => {
      b.disabled = !humanCanMove || heights[c] >= ROWS;
      b.classList.toggle("focus", humanCanMove && c === focusCol && heights[c] < ROWS);
    });
  }
  function isHumanMove(k) { return (k % 2 === 0) === (starter === HUMAN); }
  function canUndo() {
    if (over || busy) return false;
    return vsAI() ? history.some((_, k) => isHumanMove(k)) : history.length > 0;
  }

  // ---------- Input ----------
  for (let c = 0; c < COLS; c++) {
    const b = document.createElement("button");
    b.className = "col";
    b.setAttribute("aria-label", `Drop in column ${c + 1}`);
    b.addEventListener("pointerenter", () => { focusCol = c; render(); });
    b.addEventListener("click", () => humanMove(c));
    colsEl.appendChild(b);
  }
  document.addEventListener("keydown", e => {
    if (e.target.tagName === "SELECT") return;
    if (e.key === "ArrowLeft") { focusCol = (focusCol + COLS - 1) % COLS; render(); e.preventDefault(); }
    else if (e.key === "ArrowRight") { focusCol = (focusCol + 1) % COLS; render(); e.preventDefault(); }
    else if (e.key === "Enter" || e.key === " " || e.key === "ArrowDown") {
      if (e.target.tagName === "BUTTON" && !e.target.classList.contains("col")) return;
      humanMove(focusCol); e.preventDefault();
    }
    else if (/^[1-7]$/.test(e.key)) humanMove(+e.key - 1);
    else if (e.key === "n" || e.key === "N") newGame(true);
    else if ((e.key === "z" || e.key === "Z") || e.key === "Backspace") undo();
  });
  $("new").addEventListener("click", () => newGame(true));
  $("undo").addEventListener("click", undo);
  for (const id of ["mode-ai", "mode-pvp"]) $(id).addEventListener("click", e => {
    if (e.currentTarget.dataset.mode === mode) return;
    mode = e.currentTarget.dataset.mode; store.set("mode", mode);
    newGame(false);
  });
  $("level").addEventListener("change", e => store.set("level", e.target.value));
  const soundBtn = $("sound");
  const syncSound = () => { soundBtn.textContent = soundOn ? "Sound on" : "Sound off"; soundBtn.setAttribute("aria-pressed", soundOn); };
  soundBtn.addEventListener("click", () => { soundOn = !soundOn; store.set("sound", soundOn); syncSound(); });
  syncSound();

  newGame(false);
})();
</script>
</body>
</html>
